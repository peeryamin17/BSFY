model_name: "ai4bharat/indictrans2-en-indic-1B"
model_type: "indic2"
src_lang: "eng_Latn"
tgt_lang: "kas_Arab"
source_prefix: "<2kas_Arab> "
output_dir: "outputs/models/indic2-baseline"

data_dir: "data"
train_file: "data/train.csv"
val_file: "data/val.csv"
test_file: "data/test.csv"
source_column: "english_text"
target_column: "kashmiri_text"

max_source_length: 128
max_target_length: 128

per_device_train_batch_size: 8
per_device_eval_batch_size: 8
gradient_accumulation_steps: 1
learning_rate: 3e-5
warmup_steps: 500
num_train_epochs: 3
weight_decay: 0.01
logging_steps: 100
eval_steps: 500
save_steps: 500
save_total_limit: 3
gradient_checkpointing: true
optim: "adamw_torch"
fp16: true
predict_with_generate: true
seed: 42
num_proc: 4
cache_dir: "outputs/cache"
dataloader_num_workers: 2
torch_compile: false

use_lora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: ["q_proj", "v_proj"]
merge_lora: true

num_beams: 4
length_penalty: 0.6
max_generate_tokens: 128
batch_size: 32
